name: Build Windows VirtIO Drivers ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # paths:
    #   - 'containerdisk-windows-server/Dockerfile.drivers'
    #   - 'containerdisk-windows-server/autounattend.xml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/windows-drivers

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache VirtIO drivers
        id: cache-virtio
        uses: actions/cache@v4
        with:
          path: containerdisk-windows-server/virtio-win.iso
          key: virtio-win-stable-v1

      - name: Download VirtIO drivers
        if: steps.cache-virtio.outputs.cache-hit != 'true'
        working-directory: containerdisk-windows-server
        run: |
          echo "Downloading VirtIO Windows drivers..."
          curl -L -o virtio-win.iso \
            "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso"
          ls -lh virtio-win.iso

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso genisoimage

      - name: Create drivers ISO
        working-directory: containerdisk-windows-server
        run: |
          # Create directory structure for drivers ISO
          mkdir -p drivers_iso

          # Extract VirtIO drivers
          xorriso -osirrox on -indev virtio-win.iso -extract / drivers_iso/virtio
          chmod -R u+rwX drivers_iso/

          # Copy autounattend.xml to drivers ISO root
          cp autounattend.xml drivers_iso/

          # Copy MSI installer to root for easy access
          cp drivers_iso/virtio/virtio-win-gt-x64.msi drivers_iso/ || true
          cp drivers_iso/virtio/virtio-win-guest-tools.exe drivers_iso/ || true

          # Create the drivers ISO
          genisoimage -o drivers.iso \
            -joliet -joliet-long \
            -rock \
            -volid "OEMDRV" \
            drivers_iso/

          # Clean up
          rm -rf drivers_iso

          ls -lh drivers.iso

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push drivers ISO image
        working-directory: containerdisk-windows-server
        run: |
          docker build -f Dockerfile.drivers \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=server" \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:server .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:server | tee push.log

          # Output for Renovate - extract digest from push output
          DIGEST=$(grep -oP 'digest: \Ksha256:[a-f0-9]+' push.log || docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:server | cut -d'@' -f2)
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:server"
          IMAGE_WITH_DIGEST="${IMAGE_TAG}@${DIGEST}"

          echo "## Drivers ISO Image" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE_WITH_DIGEST}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Renovate:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "# renovate: datasource=docker depName=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "image: ${IMAGE_WITH_DIGEST}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
