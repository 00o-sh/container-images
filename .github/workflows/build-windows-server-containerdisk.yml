name: Build Windows Server 2022 ContainerDisk

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/windows-server-2022-eval-iso

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Cache Windows Server ISO
        id: cache-windows-iso
        uses: actions/cache@v4
        with:
          path: containerdisk-windows-server/SERVER_EVAL_x64FRE_en-us.iso
          key: windows-server-2022-eval-iso-v1

      - name: Download Windows Server 2022 ISO
        if: steps.cache-windows-iso.outputs.cache-hit != 'true'
        working-directory: containerdisk-windows-server
        run: |
          echo "Downloading Windows Server 2022 Evaluation ISO..."
          curl -L -o SERVER_EVAL_x64FRE_en-us.iso \
            "https://go.microsoft.com/fwlink/p/?LinkID=2195280&clcid=0x409&culture=en-us&country=US"
          ls -lh SERVER_EVAL_x64FRE_en-us.iso

      - name: Cache VirtIO drivers
        id: cache-virtio
        uses: actions/cache@v4
        with:
          path: containerdisk-windows-server/virtio-win.iso
          key: virtio-win-stable-v1

      - name: Download VirtIO drivers
        if: steps.cache-virtio.outputs.cache-hit != 'true'
        working-directory: containerdisk-windows-server
        run: |
          echo "Downloading VirtIO Windows drivers..."
          curl -L -o virtio-win.iso \
            "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso"
          ls -lh virtio-win.iso

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso

      - name: Extract VirtIO drivers
        working-directory: containerdisk-windows-server
        run: |
          # Extract VirtIO drivers
          xorriso -osirrox on -indev virtio-win.iso -extract / virtio_contents
          rm virtio-win.iso

          # Fix permissions (ISO extracts as read-only)
          chmod -R u+rwX virtio_contents/

          ls -la virtio_contents/ | head -20

      - name: Modify ISO in-place with xorriso
        working-directory: containerdisk-windows-server
        run: |
          # Use xorriso to modify ISO in-place (preserves boot configuration)
          xorriso -indev SERVER_EVAL_x64FRE_en-us.iso \
            -outdev modified.iso \
            -boot_image any replay \
            -volid "WS2022_EVAL" \
            -map autounattend.xml /autounattend.xml \
            -map virtio_contents /virtio \
            -map virtio_contents/virtio-win-gt-x64.msi /virtio-win-gt-x64.msi \
            -map virtio_contents/virtio-win-guest-tools.exe /virtio-win-guest-tools.exe \
            -end

          # Replace original with modified
          rm SERVER_EVAL_x64FRE_en-us.iso
          mv modified.iso SERVER_EVAL_x64FRE_en-us.iso

          # Clean up
          rm -rf virtio_contents

          ls -lh SERVER_EVAL_x64FRE_en-us.iso

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        working-directory: containerdisk-windows-server
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval
