name: Build Windows Server 2022 ContainerDisk

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'containerdisk-windows-server/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/windows-server-2022-eval-iso

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Cache Windows Server ISO
        id: cache-windows-iso
        uses: actions/cache@v4
        with:
          path: containerdisk-windows-server/SERVER_EVAL_x64FRE_en-us.iso
          key: windows-server-2022-eval-iso-v1

      - name: Download Windows Server 2022 ISO
        if: steps.cache-windows-iso.outputs.cache-hit != 'true'
        working-directory: containerdisk-windows-server
        run: |
          echo "Downloading Windows Server 2022 Evaluation ISO..."
          curl -L -o SERVER_EVAL_x64FRE_en-us.iso \
            "https://go.microsoft.com/fwlink/p/?LinkID=2195280&clcid=0x409&culture=en-us&country=US"
          ls -lh SERVER_EVAL_x64FRE_en-us.iso

      - name: Cache VirtIO drivers
        id: cache-virtio
        uses: actions/cache@v4
        with:
          path: containerdisk-windows-server/virtio-win.iso
          key: virtio-win-stable-v1

      - name: Download VirtIO drivers
        if: steps.cache-virtio.outputs.cache-hit != 'true'
        working-directory: containerdisk-windows-server
        run: |
          echo "Downloading VirtIO Windows drivers..."
          curl -L -o virtio-win.iso \
            "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso"
          ls -lh virtio-win.iso

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso

      - name: Extract and customize ISO
        working-directory: containerdisk-windows-server
        run: |
          # Extract Windows ISO contents
          xorriso -osirrox on -indev SERVER_EVAL_x64FRE_en-us.iso -extract / iso_contents
          rm SERVER_EVAL_x64FRE_en-us.iso

          # Fix permissions (ISO extracts as read-only)
          chmod -R u+w iso_contents/

          # Extract VirtIO drivers
          xorriso -osirrox on -indev virtio-win.iso -extract / virtio_contents
          rm virtio-win.iso

          # Fix VirtIO permissions (ISO extracts as read-only)
          chmod -R u+w virtio_contents/

          # Create drivers directory and copy VirtIO drivers
          mkdir -p iso_contents/virtio
          cp -r virtio_contents/* iso_contents/virtio/
          rm -rf virtio_contents

          # Copy the MSI installer to root for easy access
          cp iso_contents/virtio/virtio-win-gt-x64.msi iso_contents/ || true
          cp iso_contents/virtio/virtio-win-guest-tools.exe iso_contents/ || true

          # Add autounattend.xml to root of ISO
          cp autounattend.xml iso_contents/

          ls -la iso_contents/
          ls -la iso_contents/virtio/ | head -20

      - name: Repack ISO with unattended config
        working-directory: containerdisk-windows-server
        run: |
          # Create new ISO with both BIOS and UEFI boot support
          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "WS2022_EVAL" \
            -eltorito-boot boot/etfsboot.com \
            -no-emul-boot \
            -boot-load-size 8 \
            -eltorito-alt-boot \
            -eltorito-boot efi/microsoft/boot/efisys.bin \
            -no-emul-boot \
            -output SERVER_EVAL_x64FRE_en-us.iso \
            iso_contents

          # Clean up extracted contents
          rm -rf iso_contents

          ls -lh SERVER_EVAL_x64FRE_en-us.iso

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        working-directory: containerdisk-windows-server
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval
