name: Build Windows Server Disk Image (Packer)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Windows Server version to build'
        required: false
        default: '2022'
        type: choice
        options:
          - '2022'
      accelerator:
        description: 'QEMU accelerator (kvm = fast, tcg = slow but works everywhere)'
        required: false
        default: 'tcg'
        type: choice
        options:
          - tcg
          - kvm

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/windows-server
  PACKER_VERSION: "1.10.0"

jobs:
  check-kvm:
    runs-on: ubuntu-latest
    outputs:
      kvm_available: ${{ steps.check.outputs.kvm_available }}
    steps:
      - name: Check KVM availability
        id: check
        run: |
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is available"
            echo "kvm_available=true" >> $GITHUB_OUTPUT
          else
            echo "KVM is NOT available - will use TCG (software emulation)"
            echo "kvm_available=false" >> $GITHUB_OUTPUT
          fi

  download-isos:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Download Windows Server 2022 ISO
        run: |
          echo "Downloading Windows Server 2022 Evaluation ISO..."
          curl -L -o windows-server-2022.iso "https://go.microsoft.com/fwlink/p/?LinkID=2195280&clcid=0x409&culture=en-us&country=US"

          # Validate ISO size (should be >4GB)
          SIZE=$(stat -c%s "windows-server-2022.iso")
          if [ "$SIZE" -lt 1000000000 ]; then
            echo "ERROR: Downloaded file is only $SIZE bytes. Expected >1GB."
            echo "Microsoft may block downloads from cloud IPs."
            rm -f windows-server-2022.iso
            exit 1
          fi
          echo "Downloaded ISO size: $(ls -lh windows-server-2022.iso | awk '{print $5}')"

      - name: Download VirtIO drivers ISO
        run: |
          echo "Downloading VirtIO drivers ISO..."
          curl -L -o virtio-win.iso "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso"
          ls -lh virtio-win.iso

      - name: Upload Windows ISO
        uses: actions/upload-artifact@v4
        with:
          name: windows-server-2022-iso
          path: windows-server-2022.iso
          retention-days: 1

      - name: Upload VirtIO ISO
        uses: actions/upload-artifact@v4
        with:
          name: virtio-win-iso
          path: virtio-win.iso
          retention-days: 1

  build-disk-image:
    needs: [check-kvm, download-isos]
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours for TCG mode
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Download Windows ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-server-2022-iso
          path: packer-windows-server/

      - name: Download VirtIO ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: virtio-win-iso
          path: packer-windows-server/

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            genisoimage \
            p7zip-full

      - name: Find OVMF firmware paths
        id: ovmf
        run: |
          # Find OVMF firmware files (different paths on different distros)
          echo "Searching for OVMF firmware..."

          # Try common paths for OVMF_CODE
          for path in \
            "/usr/share/OVMF/OVMF_CODE_4M.fd" \
            "/usr/share/OVMF/OVMF_CODE.fd" \
            "/usr/share/edk2/ovmf/OVMF_CODE.fd" \
            "/usr/share/qemu/OVMF_CODE.fd"; do
            if [ -f "$path" ]; then
              echo "Found OVMF_CODE at: $path"
              echo "efi_code=$path" >> $GITHUB_OUTPUT
              break
            fi
          done

          # Try common paths for OVMF_VARS
          for path in \
            "/usr/share/OVMF/OVMF_VARS_4M.fd" \
            "/usr/share/OVMF/OVMF_VARS.fd" \
            "/usr/share/edk2/ovmf/OVMF_VARS.fd" \
            "/usr/share/qemu/OVMF_VARS.fd"; do
            if [ -f "$path" ]; then
              echo "Found OVMF_VARS at: $path"
              echo "efi_vars=$path" >> $GITHUB_OUTPUT
              break
            fi
          done

          # List what we found
          echo "Available OVMF files:"
          find /usr/share -name "OVMF*" -o -name "ovmf*" 2>/dev/null | head -20 || true

      - name: Install Packer
        run: |
          curl -fsSL https://releases.hashicorp.com/packer/${{ env.PACKER_VERSION }}/packer_${{ env.PACKER_VERSION }}_linux_amd64.zip -o packer.zip
          unzip packer.zip
          sudo mv packer /usr/local/bin/
          packer version

      - name: Initialize Packer
        working-directory: packer-windows-server
        run: packer init windows-server-2022.pkr.hcl

      - name: Determine accelerator
        id: accel
        run: |
          if [ "${{ github.event.inputs.accelerator }}" == "kvm" ] && [ "${{ needs.check-kvm.outputs.kvm_available }}" == "true" ]; then
            echo "accelerator=kvm" >> $GITHUB_OUTPUT
            echo "Using KVM acceleration"
          else
            echo "accelerator=tcg" >> $GITHUB_OUTPUT
            echo "Using TCG (software emulation) - this will be slow!"
          fi

      - name: Create OEMDRV ISO with VirtIO drivers and autounattend
        working-directory: packer-windows-server
        run: |
          # Extract VirtIO drivers
          mkdir -p oemdrv-contents
          7z x virtio-win.iso -ooemdrv-contents

          # Copy autounattend.xml to ISO root (Windows looks for it here)
          cp autounattend.xml oemdrv-contents/

          # Create OEMDRV ISO - this will be mounted as E: drive
          # Windows autounattend.xml references E: for VirtIO driver paths
          genisoimage -o oemdrv.iso \
            -V "OEMDRV" \
            -J -r \
            oemdrv-contents/

          ls -lh oemdrv.iso

          # Cleanup extracted files to save space
          rm -rf oemdrv-contents

      - name: Build disk image with Packer
        working-directory: packer-windows-server
        run: |
          echo "Starting Packer build with ${{ steps.accel.outputs.accelerator }} accelerator..."
          echo "EFI firmware: ${{ steps.ovmf.outputs.efi_code }}"
          echo "This may take several hours in TCG mode."

          # Drive layout:
          # - D: Windows ISO (boot/install media)
          # - E: OEMDRV ISO (VirtIO drivers + autounattend.xml)

          packer build \
            -var "iso_url=windows-server-2022.iso" \
            -var "iso_checksum=none" \
            -var "accelerator=${{ steps.accel.outputs.accelerator }}" \
            -var "efi_firmware_code=${{ steps.ovmf.outputs.efi_code }}" \
            -var "efi_firmware_vars=${{ steps.ovmf.outputs.efi_vars }}" \
            -var "headless=true" \
            -on-error=abort \
            windows-server-2022.pkr.hcl
        env:
          PACKER_LOG: 1

      - name: Verify output
        working-directory: packer-windows-server
        run: |
          ls -lh windows-server-2022.qcow2
          qemu-img info windows-server-2022.qcow2

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push disk image
        working-directory: packer-windows-server
        run: |
          docker build -f Dockerfile.disk \
            --build-arg DISK_FILE=windows-server-2022.qcow2 \
            --label "org.opencontainers.image.title=Windows Server 2022 Disk Image (Sysprepped)" \
            --label "org.opencontainers.image.description=Pre-installed, sysprepped Windows Server 2022 QCOW2 disk image for KubeVirt. Boots directly to OOBE." \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=2022-disk" \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:2022-disk \
            .

          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:2022-disk | tee push.log
          DIGEST=$(grep -oP 'digest: \Ksha256:[a-f0-9]+' push.log || echo "unknown")

          echo "## Windows Server 2022 Disk Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pre-installed, sysprepped Windows Server 2022 QCOW2 disk image." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:2022-disk@${DIGEST}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
