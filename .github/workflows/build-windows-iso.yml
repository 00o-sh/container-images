name: Build Windows Server 2022 ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # paths:
    #   - 'containerdisk-windows-server/Dockerfile.windows'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/windows-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Cache Windows Server ISO
        id: cache-windows-iso
        uses: actions/cache@v4
        with:
          path: containerdisk-windows-server/SERVER_EVAL_x64FRE_en-us.iso
          key: windows-server-2022-eval-iso-v2

      - name: Download Windows Server 2022 ISO
        if: steps.cache-windows-iso.outputs.cache-hit != 'true'
        working-directory: containerdisk-windows-server
        run: |
          echo "Downloading Windows Server 2022 Evaluation ISO..."
          curl -L -o SERVER_EVAL_x64FRE_en-us.iso \
            "https://go.microsoft.com/fwlink/p/?LinkID=2195280&clcid=0x409&culture=en-us&country=US"
          ls -lh SERVER_EVAL_x64FRE_en-us.iso

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Windows ISO image
        working-directory: containerdisk-windows-server
        run: |
          docker build -f Dockerfile.windows -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval

          # Get and display image digest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval)
          echo "## Image Published" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY
