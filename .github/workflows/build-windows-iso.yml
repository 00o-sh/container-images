name: Build Windows Server 2022 ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'containerdisk-windows-server/Dockerfile.windows'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/windows-server

jobs:
  download:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-windows-iso.outputs.cache-hit }}
    steps:
      - name: Cache Windows Server ISO
        id: cache-windows-iso
        uses: actions/cache@v4
        with:
          path: SERVER_EVAL_x64FRE_en-us.iso
          key: windows-server-2022-eval-iso-v2

      - name: Free up disk space
        if: steps.cache-windows-iso.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Download Windows Server 2022 ISO
        if: steps.cache-windows-iso.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Windows Server 2022 Evaluation ISO..."
          curl -L -o SERVER_EVAL_x64FRE_en-us.iso \
            "https://go.microsoft.com/fwlink/p/?LinkID=2195280&clcid=0x409&culture=en-us&country=US"
          ls -lh SERVER_EVAL_x64FRE_en-us.iso

  build-original:
    needs: download
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Restore Windows Server ISO from cache
        uses: actions/cache@v4
        with:
          path: SERVER_EVAL_x64FRE_en-us.iso
          key: windows-server-2022-eval-iso-v2

      - name: Move ISO to build context
        run: mv SERVER_EVAL_x64FRE_en-us.iso containerdisk-windows-server/

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Windows ISO image
        working-directory: containerdisk-windows-server
        run: |
          docker build -f Dockerfile.windows \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=ltsc2022-eval" \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval

          # Get digest and format for Renovate compatibility (image:tag@sha256:...)
          DIGEST_FULL=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval)
          SHA=$(echo "$DIGEST_FULL" | cut -d'@' -f2)
          IMAGE_WITH_DIGEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval@${SHA}"

          echo "## Original ISO Image" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMAGE_WITH_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "# renovate: datasource=docker depName=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "image: ${IMAGE_WITH_DIGEST}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  build-noprompt:
    needs: download
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Restore Windows Server ISO from cache
        uses: actions/cache@v4
        with:
          path: SERVER_EVAL_x64FRE_en-us.iso
          key: windows-server-2022-eval-iso-v2

      - name: Move ISO to build context
        run: mv SERVER_EVAL_x64FRE_en-us.iso containerdisk-windows-server/

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full xorriso

      - name: Create no-prompt ISO
        working-directory: containerdisk-windows-server
        run: |
          # Extract ISO using 7z (handles UDF better than xorriso)
          7z x SERVER_EVAL_x64FRE_en-us.iso -oiso_np
          chmod -R u+rwX iso_np/

          # List boot files to verify extraction
          ls -la iso_np/boot/ || echo "No boot directory"
          ls -la iso_np/efi/microsoft/boot/ || echo "No EFI boot directory"

          # Replace EFI bootloaders with no-prompt versions
          if [ -f "iso_np/efi/microsoft/boot/efisys_noprompt.bin" ]; then
            cp iso_np/efi/microsoft/boot/efisys_noprompt.bin iso_np/efi/microsoft/boot/efisys.bin
            echo "Replaced efisys.bin with no-prompt version"
          fi

          if [ -f "iso_np/efi/microsoft/boot/cdboot_noprompt.efi" ]; then
            cp iso_np/efi/microsoft/boot/cdboot_noprompt.efi iso_np/efi/microsoft/boot/cdboot.efi
            echo "Replaced cdboot.efi with no-prompt version"
          fi

          # Get original volume ID
          VOLID=$(xorriso -indev SERVER_EVAL_x64FRE_en-us.iso -pvd_info 2>&1 | grep "Volume Id" | cut -d":" -f2 | xargs)

          # Repack ISO with EFI boot support
          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "${VOLID}" \
            -eltorito-boot boot/etfsboot.com \
            -no-emul-boot \
            -boot-load-size 8 \
            -eltorito-alt-boot \
            -eltorito-boot efi/microsoft/boot/efisys.bin \
            -no-emul-boot \
            -o SERVER_EVAL_noprompt.iso \
            iso_np/

          rm -rf iso_np/
          ls -lh SERVER_EVAL_noprompt.iso

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push no-prompt ISO image
        working-directory: containerdisk-windows-server
        run: |
          cat > Dockerfile.noprompt << 'EOF'
          FROM scratch
          LABEL org.opencontainers.image.title="Windows Server 2022 Evaluation ISO (No-Prompt EFI)"
          LABEL org.opencontainers.image.description="Windows Server 2022 LTSC Evaluation ISO with no-prompt EFI bootloader for automated KubeVirt installations. 180-day evaluation license."
          LABEL org.opencontainers.image.vendor="00o-sh"
          LABEL org.opencontainers.image.licenses="Proprietary"
          LABEL org.opencontainers.image.source="https://github.com/00o-sh/container-images"
          LABEL org.opencontainers.image.documentation="https://github.com/00o-sh/container-images/tree/main/containerdisk-windows-server"
          ADD SERVER_EVAL_noprompt.iso /disk/disk.img
          EOF

          docker build -f Dockerfile.noprompt \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=ltsc2022-eval-np" \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval-np .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval-np

          # Get digest and format for Renovate compatibility (image:tag@sha256:...)
          DIGEST_FULL=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval-np)
          SHA=$(echo "$DIGEST_FULL" | cut -d'@' -f2)
          IMAGE_WITH_DIGEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ltsc2022-eval-np@${SHA}"

          echo "## No-Prompt ISO Image" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMAGE_WITH_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "# renovate: datasource=docker depName=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "image: ${IMAGE_WITH_DIGEST}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*No-prompt version skips 'Press any key to boot from CD' for automated EFI boot*" >> $GITHUB_STEP_SUMMARY
