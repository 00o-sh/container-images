name: Build Windows Server ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Windows Server version to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '2019'
          - '2022'
          - '2025'
  push:
    branches:
      - main
    paths:
      - 'containerdisk-windows-server/Dockerfile.windows'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/windows-server

jobs:
  matrix-setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set up build matrix
        id: set-matrix
        run: |
          if [ "${{ github.event.inputs.version }}" == "2019" ]; then
            MATRIX='{"include":[{"version":"2019","tag":"ltsc2019-eval","url":"https://go.microsoft.com/fwlink/p/?LinkID=2195167&clcid=0x409&culture=en-us&country=US","cache_key":"v1"}]}'
          elif [ "${{ github.event.inputs.version }}" == "2022" ]; then
            MATRIX='{"include":[{"version":"2022","tag":"ltsc2022-eval","url":"https://go.microsoft.com/fwlink/p/?LinkID=2195280&clcid=0x409&culture=en-us&country=US","cache_key":"v2"}]}'
          elif [ "${{ github.event.inputs.version }}" == "2025" ]; then
            MATRIX='{"include":[{"version":"2025","tag":"ltsc2025-eval","url":"https://software-static.download.prss.microsoft.com/dbazure/998969d5-f34g-4e03-ac9d-1f9786c66749/26100.32230.260111-0550.lt_release_svc_refresh_SERVER_EVAL_x64FRE_en-us.iso","cache_key":"v4"}]}'
          else
            MATRIX='{"include":[{"version":"2019","tag":"ltsc2019-eval","url":"https://go.microsoft.com/fwlink/p/?LinkID=2195167&clcid=0x409&culture=en-us&country=US","cache_key":"v1"},{"version":"2022","tag":"ltsc2022-eval","url":"https://go.microsoft.com/fwlink/p/?LinkID=2195280&clcid=0x409&culture=en-us&country=US","cache_key":"v2"},{"version":"2025","tag":"ltsc2025-eval","url":"https://software-static.download.prss.microsoft.com/dbazure/998969d5-f34g-4e03-ac9d-1f9786c66749/26100.32230.260111-0550.lt_release_svc_refresh_SERVER_EVAL_x64FRE_en-us.iso","cache_key":"v4"}]}'
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  download:
    needs: matrix-setup
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Cache Windows Server ${{ matrix.version }} ISO
        id: cache-iso
        uses: actions/cache@v4
        with:
          path: windows-server-${{ matrix.version }}.iso
          key: windows-server-${{ matrix.version }}-eval-iso-${{ matrix.cache_key }}

      - name: Free up disk space
        if: steps.cache-iso.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Download Windows Server ${{ matrix.version }} ISO
        if: steps.cache-iso.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Windows Server ${{ matrix.version }} Evaluation ISO..."
          curl -L -o windows-server-${{ matrix.version }}.iso "${{ matrix.url }}"

          # Validate ISO size (should be >1GB, not a 403 error page)
          SIZE=$(stat -c%s "windows-server-${{ matrix.version }}.iso")
          if [ "$SIZE" -lt 1000000000 ]; then
            echo "ERROR: Downloaded file is only $SIZE bytes. Expected >1GB."
            echo "Microsoft blocks downloads from cloud IPs. Use cached ISO or self-hosted runner."
            rm -f windows-server-${{ matrix.version }}.iso
            exit 1
          fi
          ls -lh windows-server-${{ matrix.version }}.iso

  build-original:
    needs: [matrix-setup, download]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Restore Windows Server ${{ matrix.version }} ISO from cache
        uses: actions/cache@v4
        with:
          path: windows-server-${{ matrix.version }}.iso
          key: windows-server-${{ matrix.version }}-eval-iso-${{ matrix.cache_key }}

      - name: Validate and move ISO to build context
        run: |
          # Validate ISO size before processing
          SIZE=$(stat -c%s "windows-server-${{ matrix.version }}.iso")
          if [ "$SIZE" -lt 1000000000 ]; then
            echo "ERROR: ISO is only $SIZE bytes. Cache may be corrupted."
            echo "Clear cache key 'windows-server-${{ matrix.version }}-eval-iso-${{ matrix.cache_key }}' and re-run."
            exit 1
          fi
          mv windows-server-${{ matrix.version }}.iso containerdisk-windows-server/SERVER_EVAL.iso

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Windows Server ${{ matrix.version }} ISO image
        working-directory: containerdisk-windows-server
        run: |
          docker build -f Dockerfile.windows \
            --build-arg ISO_FILE=SERVER_EVAL.iso \
            --label "org.opencontainers.image.title=Windows Server ${{ matrix.version }} Evaluation ISO" \
            --label "org.opencontainers.image.description=Windows Server ${{ matrix.version }} LTSC Evaluation ISO for KubeVirt ContainerDisk. 180-day evaluation license." \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${{ matrix.tag }}" \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }} .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }} | tee push.log

          # Output for Renovate - extract digest from push output
          DIGEST=$(grep -oP 'digest: \Ksha256:[a-f0-9]+' push.log || docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }} | cut -d'@' -f2)
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}"
          IMAGE_WITH_DIGEST="${IMAGE_TAG}@${DIGEST}"

          echo "## Windows Server ${{ matrix.version }} ISO" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE_WITH_DIGEST}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Renovate:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "# renovate: datasource=docker depName=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "image: ${IMAGE_WITH_DIGEST}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  build-noprompt:
    needs: [matrix-setup, download]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Restore Windows Server ${{ matrix.version }} ISO from cache
        uses: actions/cache@v4
        with:
          path: windows-server-${{ matrix.version }}.iso
          key: windows-server-${{ matrix.version }}-eval-iso-${{ matrix.cache_key }}

      - name: Validate and move ISO to build context
        run: |
          # Validate ISO size before processing
          SIZE=$(stat -c%s "windows-server-${{ matrix.version }}.iso")
          if [ "$SIZE" -lt 1000000000 ]; then
            echo "ERROR: ISO is only $SIZE bytes. Cache may be corrupted."
            echo "Clear cache key 'windows-server-${{ matrix.version }}-eval-iso-${{ matrix.cache_key }}' and re-run."
            exit 1
          fi
          mv windows-server-${{ matrix.version }}.iso containerdisk-windows-server/SERVER_EVAL.iso

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full xorriso

      - name: Create no-prompt ISO
        working-directory: containerdisk-windows-server
        run: |
          # Extract ISO using 7z (handles UDF better than xorriso)
          7z x SERVER_EVAL.iso -oiso_np
          chmod -R u+rwX iso_np/

          # List boot files to verify extraction
          ls -la iso_np/boot/ || echo "No boot directory"
          ls -la iso_np/efi/microsoft/boot/ || echo "No EFI boot directory"

          # Replace EFI bootloaders with no-prompt versions
          if [ -f "iso_np/efi/microsoft/boot/efisys_noprompt.bin" ]; then
            cp iso_np/efi/microsoft/boot/efisys_noprompt.bin iso_np/efi/microsoft/boot/efisys.bin
            echo "Replaced efisys.bin with no-prompt version"
          fi

          if [ -f "iso_np/efi/microsoft/boot/cdboot_noprompt.efi" ]; then
            cp iso_np/efi/microsoft/boot/cdboot_noprompt.efi iso_np/efi/microsoft/boot/cdboot.efi
            echo "Replaced cdboot.efi with no-prompt version"
          fi

          # Get original volume ID
          VOLID=$(xorriso -indev SERVER_EVAL.iso -pvd_info 2>&1 | grep "Volume Id" | cut -d":" -f2 | xargs)

          # Repack ISO with EFI boot support
          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "${VOLID}" \
            -eltorito-boot boot/etfsboot.com \
            -no-emul-boot \
            -boot-load-size 8 \
            -eltorito-alt-boot \
            -eltorito-boot efi/microsoft/boot/efisys.bin \
            -no-emul-boot \
            -o SERVER_EVAL_noprompt.iso \
            iso_np/

          rm -rf iso_np/
          ls -lh SERVER_EVAL_noprompt.iso

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push no-prompt ISO image
        working-directory: containerdisk-windows-server
        run: |
          cat > Dockerfile.noprompt << EOF
          FROM scratch
          LABEL org.opencontainers.image.title="Windows Server ${{ matrix.version }} Evaluation ISO (No-Prompt EFI)"
          LABEL org.opencontainers.image.description="Windows Server ${{ matrix.version }} LTSC Evaluation ISO with no-prompt EFI bootloader for automated KubeVirt installations."
          LABEL org.opencontainers.image.vendor="00o-sh"
          LABEL org.opencontainers.image.licenses="Proprietary"
          LABEL org.opencontainers.image.source="https://github.com/00o-sh/container-images"
          ADD SERVER_EVAL_noprompt.iso /disk/disk.img
          EOF

          docker build -f Dockerfile.noprompt \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${{ matrix.tag }}-np" \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}-np .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}-np | tee push.log

          # Output for Renovate - extract digest from push output
          DIGEST=$(grep -oP 'digest: \Ksha256:[a-f0-9]+' push.log || docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}-np | cut -d'@' -f2)
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}-np"
          IMAGE_WITH_DIGEST="${IMAGE_TAG}@${DIGEST}"

          echo "## Windows Server ${{ matrix.version }} ISO (No-Prompt)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE_WITH_DIGEST}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Renovate:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "# renovate: datasource=docker depName=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "image: ${IMAGE_WITH_DIGEST}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "*No-prompt version skips 'Press any key to boot from CD'*" >> $GITHUB_STEP_SUMMARY
